[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ForArt"
version = "0.1.0"
description = "A CLI tool to make cool patterns using Python 'for' loops."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.scripts]
forart = "forart.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["forart"]
